<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APK Hub — Games</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="layout">
  <div id="sideMount"></div>
  <div class="main">
    <div id="navMount"></div>
    <div class="content">
      <h1 style="font-size:34px;margin-bottom:8px">🎮 Games</h1>
      <p style="color:var(--muted);margin-bottom:18px">Modded games ready to play.</p>
      <div class="grid" id="grid"></div>
    </div>
    <div class="footer">© 2026 APK Hub</div>
  </div>
</div>
<div id="chatMount"></div>
<script src="data.js"></script>
<script>
document.getElementById('sideMount').innerHTML=sideHTML();
document.getElementById('navMount').innerHTML=navHTML('Games');
document.getElementById('chatMount').innerHTML=chatHTML();
document.getElementById('grid').innerHTML=APPS.filter(a=>a.cat==='games').map((a,i)=>cardHTML(a,i)).join('');
</script>
</body>
</html>
