<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APK Hub — Apps</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="layout">
  <div id="sideMount"></div>
  <div class="main">
    <div id="navMount"></div>
    <div class="content">
      <h1 class="hero" style="padding-top:8px;font-size:34px;margin-bottom:8px">All Apps</h1>
      <p style="color:var(--muted);margin-bottom:18px">Browse premium apps, tools, editors and more.</p>
      <div class="search"><span class="ic">⌕</span><input id="q" placeholder="Search apps..." oninput="render()"></div>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="footer">© 2026 APK Hub</div>
  </div>
</div>
<div id="chatMount"></div>
<script src="data.js"></script>
<script>
document.getElementById('sideMount').innerHTML=sideHTML();
document.getElementById('navMount').innerHTML=navHTML('Apps');
document.getElementById('chatMount').innerHTML=chatHTML();
let filter='all';
const cats=[['all','✨ All'],['video','🎬 Video'],['tools','🛠 Tools'],['music','🎵 Music'],['photo','📷 Photo'],['social','📱 Social']];
document.getElementById('chips').innerHTML=cats.map(([k,l])=>`<button class="chip ${k==='all'?'active':''}" data-k="${k}">${l}</button>`).join('');
document.querySelectorAll('#chips .chip').forEach(c=>c.onclick=()=>{filter=c.dataset.k;document.querySelectorAll('#chips .chip').forEach(x=>x.classList.toggle('active',x===c));render();});
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const list=APPS.filter(a=>a.cat!=='games'&&(filter==='all'||a.cat===filter)&&(a.name.toLowerCase().includes(q)||a.desc.toLowerCase().includes(q)));
  document.getElementById('grid').innerHTML=list.map((a,i)=>cardHTML(a,i)).join('')||'<p class="muted">Nothing found</p>';
}
render();
</script>
</body>
</html>
